[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 301

[[redirects]]
  from = "/card"
  to = "/card/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/card/card.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/card/card.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/801-home-repair.vcf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
